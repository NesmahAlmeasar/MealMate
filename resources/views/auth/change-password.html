<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Nutrition Specialist Dashboard</title>
    <link rel="stylesheet" href="New folder/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .change-password-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--olive-light) 0%, var(--blue-light) 100%);
            padding: 20px;
        }

        .change-password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        .change-password-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .change-password-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--olive-dark), var(--olive-medium));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
            color: white;
        }

        .change-password-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .change-password-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .change-password-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--beige-light);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--olive-dark);
            box-shadow: 0 0 0 2px rgba(107, 142, 35, 0.1);
        }

        .password-strength {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .strength-bar.weak {
            background-color: var(--red-accent);
        }

        .strength-bar.medium {
            background-color: #F59E0B;
        }

        .strength-bar.strong {
            background-color: var(--green-accent);
        }

        .password-requirements {
            background-color: var(--olive-very-light);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-dark);
            margin-top: 10px;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .requirement-item:last-child {
            margin-bottom: 0;
        }

        .requirement-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            background-color: var(--border-color);
        }

        .requirement-icon.met {
            background-color: var(--green-accent);
        }

        .btn-submit {
            background-color: var(--blue-primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 16px;
        }

        .btn-submit:hover {
            background-color: #2563EB;
        }

        .btn-cancel {
            background-color: var(--border-color);
            color: var(--text-dark);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 16px;
        }

        .btn-cancel:hover {
            background-color: #D1D5DB;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .form-buttons button {
            flex: 1;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--olive-dark);
        }

        @media (max-width: 480px) {
            .change-password-card {
                padding: 25px;
            }

            .change-password-title {
                font-size: 24px;
            }

            .form-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="change-password-container">
        <div class="change-password-card">
            <div class="change-password-header">
                <div class="change-password-icon">🔐</div>
                <h1 class="change-password-title">Change Password</h1>
                <p class="change-password-subtitle">Update your account password</p>
            </div>

            <form class="change-password-form" id="changePasswordForm" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required oninput="checkPasswordStrength()">
                    <div class="password-strength">
                        <div class="strength-bar" id="bar1"></div>
                        <div class="strength-bar" id="bar2"></div>
                        <div class="strength-bar" id="bar3"></div>
                    </div>
                    <div class="password-requirements">
                        <div class="requirement-item">
                            <div class="requirement-icon" id="req-length">✓</div>
                            <span>At least 8 characters</span>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-icon" id="req-uppercase">✓</div>
                            <span>One uppercase letter</span>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-icon" id="req-number">✓</div>
                            <span>One number</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> Update Password
                    </button>
                    <button type="button" class="btn-cancel" onclick="goBack()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>

            <div class="back-link">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            let strength = 0;

            // Check length
            if (password.length >= 8) {
                strength++;
                document.getElementById('req-length').classList.add('met');
            } else {
                document.getElementById('req-length').classList.remove('met');
            }

            // Check uppercase
            if (/[A-Z]/.test(password)) {
                strength++;
                document.getElementById('req-uppercase').classList.add('met');
            } else {
                document.getElementById('req-uppercase').classList.remove('met');
            }

            // Check number
            if (/[0-9]/.test(password)) {
                strength++;
                document.getElementById('req-number').classList.add('met');
            } else {
                document.getElementById('req-number').classList.remove('met');
            }

            // Update strength bars
            const bars = document.querySelectorAll('.strength-bar');
            bars.forEach((bar, index) => {
                bar.classList.remove('weak', 'medium', 'strong');
                if (index < strength) {
                    if (strength === 1) bar.classList.add('weak');
                    else if (strength === 2) bar.classList.add('medium');
                    else bar.classList.add('strong');
                }
            });
        }

        function handleChangePassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (newPassword.length < 8) {
                alert('Password must be at least 8 characters long!');
                return;
            }

            // Store new password (in real app, send to server)
            localStorage.setItem('userPassword', newPassword);
            showNotification('Password updated successfully!', 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
